services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: doma
      POSTGRES_USER: doma
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doma}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doma']
      interval: 5s
      timeout: 5s
      retries: 5

  python-ai:
    build:
      context: ./ai
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '8000:8000'

  node-scraper:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Chromium spawns a tree of child processes. Without an init as PID 1, node
    # never reaps the ones a crashed browser leaves behind, and they pile up
    # against the memory limit below on a box that has only 2GB to begin with.
    init: true
    # One browser at a time. Two concurrent Chromium instances plus postgres,
    # the JVM and the Python service do not fit in 2GB — that is what left the
    # launcher unable to start a browser at all on 2026-09-29.
    mem_limit: 900m
    ports:
      - '3001:3001'
    environment:
      SPRING_SERVICE_URL: http://spring-server:8080
      MAX_CONCURRENT_BROWSERS: '1'
      # Lower this for a demo (e.g. 8000) so a broken selector fails in seconds
      # instead of spending 40s waiting for an element that isn't coming.
      SELECTOR_WAIT_MS: ${SELECTOR_WAIT_MS:-40000}
      TZ: Asia/Seoul
    # Liveness only: whether the HTTP server answers and whether a browser has
    # failed to launch since the last success. Recovery itself comes from the
    # process exiting (server/browser.js) — a compose healthcheck reports, it
    # does not restart anything.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3001/internal/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - snapshots:/app/snapshots
    depends_on:
      postgres:
        condition: service_healthy
      spring-server:
        condition: service_healthy

  spring-server:
    build:
      context: ./spring-server
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/doma
      DB_USER: doma
      DB_PASSWORD: ${DB_PASSWORD:-doma}
      SCRAPER_SERVICE_URL: http://node-scraper:3001
      PYTHON_API_URL: http://python-ai:8000
      DOMA_API_TOKEN: ${DOMA_API_TOKEN:-}
      # 수집 누락 감지 알림을 받을 웹훅. 스크래퍼별 웹훅이 없는 스크래퍼까지 덮는다.
      DOMA_ALERT_WEBHOOK_URL: ${DOMA_ALERT_WEBHOOK_URL:-}
      # 자가치유 알림이 대시보드로 돌아가는 링크를 붙일 주소. 비워두면 링크가 빠진다.
      APP_BASE_URL: ${APP_BASE_URL:-}
      TZ: Asia/Seoul
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/api/stats || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      python-ai:
        condition: service_started

volumes:
  postgres_data:
  snapshots:
